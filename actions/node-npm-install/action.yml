name: "Setup node.js and run npm install"

description: "This action checks sets up Node and installs dependencies using npm."

runs:
  using: "composite"
  steps:
    - uses: volta-cli/action@v4

    - name: Cache node modules
      id: cache-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-modules-${{ hashFiles('package-lock.json', 'patches/**') }}
        restore-keys: |
          ${{ runner.os }}-modules-

    - name: Install dependencies
      if: steps.cache-modules.outputs.cache-hit != 'true'
      shell: bash
      run: NODE_ENV=development npm ci --include=dev --audit=false
