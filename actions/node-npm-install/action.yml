name: "Setup node.js and run npm install"

description: "This action checks sets up Node and installs dependencies using npm."

runs:
  using: "composite"
  steps:
    - uses: volta-cli/action@v5

    - name: Cache node modules
      id: cache-modules
      uses: actions/cache@v5
      with:
        path: node_modules
        key: ${{ runner.os }}-modules-${{ hashFiles('package-lock.json', 'patches/**') }}
        restore-keys: |
          ${{ runner.os }}-modules-

    - name: Install dependencies
      if: steps.cache-modules.outputs.cache-hit != 'true'
      shell: bash
      # Retry to absorb the transient esbuild postinstall race (ETXTBSY): esbuild
      # writes its binary then immediately execs it to validate the version, which
      # can fail under concurrent install scripts on CI runners. A retry succeeds
      # because the binary is no longer busy on the next pass.
      run: |
        for attempt in 1 2 3; do
          if NODE_ENV=development npm ci --include=dev --audit=false; then
            exit 0
          fi
          echo "::warning::npm ci failed (attempt ${attempt}/3) — retrying in 5s"
          sleep 5
        done
        exit 1
